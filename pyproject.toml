[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgergym"
version = "0.1.0"
description = "Accounts-payable RL environment with verified rewards"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "tzdata"]
models = ["openai>=1.40", "tzdata"]

[tool.setuptools]
packages = ["ledgergym"]

[tool.setuptools.package-data]
ledgergym = ["schema.sql"]
